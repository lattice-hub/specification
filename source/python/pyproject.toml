[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-specification"
version = "0.1.0"
description = "Official Python gRPC definitions for Pole Specification"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Lattice Hub Contributors" }]
dependencies = [
    "grpcio>=1.80.0,<2",
    "protobuf>=6.31.1,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "grpcio-tools==1.80.0",
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/lattice-hub/specification"
Repository = "https://github.com/lattice-hub/specification"
Issues = "https://github.com/lattice-hub/specification/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pole_specification = ["py.typed", "proto/*.proto"]
