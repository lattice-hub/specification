syntax = "proto3";

package v1;

import "types.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/service_manage";
option java_package = "io.pole.specification.api.v1.service.manage";
option java_outer_classname = "ClientProto";

message Client {
  // client ip
  string host = 1;
  // client type
  enum ClientType {
    UNKNOWN = 0;
    SDK = 1;
    AGENT = 2;
  }
  // client type
  ClientType type = 2;
  // client version
  string version = 3;
  // location 客户端地址位置
	Location location = 4;
  // client id
	string id = 5;
  // stat 监控数据上报信息
	repeated StatInfo stat = 6;
  // creation time
	string ctime = 7;
  // modify time
	string mtime = 8;
}

message StatInfo {
  // target ip
	string target = 1;
  // target port
  uint32 port = 2;
  // api path
	string path = 3;
  // metrics protocol
	string protocol = 4;

}