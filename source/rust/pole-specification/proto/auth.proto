syntax = "proto3";

package v1;

option go_package = "github.com/pole-io/specification/source/go/api/v1/security";
option java_package = "io.github.latticehub.pole.specification.api.v1.security";
option java_outer_classname = "SecurityProto";

enum AuthAction {
  // deprecated_filed 该字段从未使用过
  ONLY_READ = 0;
  // deprecated_filed 使用 ALLOW 进行替代
  READ_WRITE = 1;
  ALLOW = 10;
  DENY = 11;
}

enum ResourceType {
  Namespaces = 0;
  Services = 1;
  ConfigGroups = 2;
  RouteRules = 3;
  RateLimitRules = 4;
  CircuitBreakerRules = 5;
  FaultDetectRules = 6;
  LaneRules = 7;
  LosslessRules = 8;
  MirrorRules = 9;
  SecurityRules = 10;
  MockRules = 11;
  Users = 20;
  UserGroups = 21;
  Roles = 22;
  PolicyRules = 23;
  MCPServerResources = 30;
  A2AAgentResources = 31;
}

message LoginRequest {
  string owner = 1;
  string name = 2;
  string password = 3;
  map<string, string> options = 4;
}

message LoginResponse {
  string user_id = 1 [ json_name = "user_id" ];
  string name = 2;
  string role = 3;
  string owner_id = 4 [ json_name = "owner_id" ];
  string token = 5;
  map<string, string> options = 6;
}

message User {
  string id = 1;
  string name = 2;
  string password = 3;
  string owner = 4;
  string source = 5;
  string auth_token = 6 [ json_name = "auth_token" ];
  bool token_enable = 7 [ json_name = "token_enable" ];
  string comment = 8;
  string ctime = 9;
  string mtime = 10;
  string user_type = 11 [ json_name = "user_type" ];
  string mobile = 12;
  string email = 13;
  map<string, string> metadata = 14;
}

message ModifyUserPassword {
  string id = 1;
  string old_password = 2 [ json_name = "old_password" ];
  string new_password = 3 [ json_name = "new_password" ];
}

message UserGroupRelation {
  string group_id = 1 [ json_name = "group_id" ];
  repeated User users = 2;
}

message UserGroup {
  string id = 1;
  string name = 2;
  string owner = 3;
  string auth_token = 4 [ json_name = "auth_token" ];
  bool token_enable = 5 [ json_name = "token_enable" ];
  string comment = 6;
  string ctime = 7;
  string mtime = 8;
  UserGroupRelation relation = 9;
  uint32 user_count = 10 [ json_name = "user_count" ];
  string source = 11;
  map<string, string> metadata = 12;
}

message ModifyUserGroup {
  string id = 1;
  string owner = 2;
  string name = 3;
  string auth_token = 4 [ json_name = "auth_token" ];
  bool token_enable = 5 [ json_name = "token_enable" ];
  string comment = 6;
  UserGroupRelation add_relations = 7 [ json_name = "add_relations" ];
  UserGroupRelation remove_relations = 8 [ json_name = "remove_relations" ];
  map<string, string> metadata = 9;
  string source = 10;
}

message Role {
  string id = 1;
  string name = 2;
  string owner = 4;
  string source = 5;
  bool default_role = 6 [ json_name = "default_role" ];
  map<string, string> metadata = 7;
  string comment = 8;
  string ctime = 9;
  string mtime = 10;
  repeated User users = 20;
  repeated UserGroup user_groups = 21 [ json_name = "user_groups" ];
}

message Principal {
  string id = 1;
  string name = 2;
}

message Principals {
  repeated Principal users = 1;
  repeated Principal groups = 2;
  repeated Principal roles = 3;
}

message StrategyResourceEntry {
  string id = 1;
  string namespace = 2;
  string name = 3;
}

message StrategyResources {
  string strategy_id = 1 [ json_name = "strategy_id" ];
  repeated StrategyResourceEntry namespaces = 2;
  repeated StrategyResourceEntry services = 3;
  repeated StrategyResourceEntry config_groups = 4 [ json_name = "config_groups" ];
  repeated StrategyResourceEntry route_rules = 5 [ json_name = "route_rules" ];
  repeated StrategyResourceEntry ratelimit_rules = 6 [ json_name = "ratelimit_rules" ];
  repeated StrategyResourceEntry circuitbreaker_rules = 7 [ json_name = "circuitbreaker_rules" ];
  repeated StrategyResourceEntry faultdetect_rules = 8 [ json_name = "faultdetect_rules" ];
  repeated StrategyResourceEntry lane_rules = 9 [ json_name = "lane_rules" ];
  repeated StrategyResourceEntry lossless_rules = 10 [ json_name = "lossless_rules" ];
  repeated StrategyResourceEntry mirror_rules = 11 [ json_name = "mirror_rules" ];
  repeated StrategyResourceEntry security_rules = 12 [ json_name = "security_rules" ];
  repeated StrategyResourceEntry mock_rules = 13 [ json_name = "mock_rules" ];

  repeated StrategyResourceEntry users = 21 [ json_name = "users" ];
  repeated StrategyResourceEntry user_groups = 22 [ json_name = "user_groups" ];
  repeated StrategyResourceEntry roles = 23 [ json_name = "roles" ];
  repeated StrategyResourceEntry auth_policies = 24 [ json_name = "auth_policies" ];

  repeated StrategyResourceEntry mcp_servers = 30 [ json_name = "mcp_servers" ];
  repeated StrategyResourceEntry a2a_agents = 31 [ json_name = "a2a_agents" ];
}

message StrategyResourceLabel {
  string key = 1;
  string value = 2;
  string compare_type = 3 [ json_name = "compare_type" ];
}

message AuthStrategy {
  string id = 1;
  string name = 2;
  Principals principals = 3;
  StrategyResources resources = 4;
  AuthAction action = 5;
  string comment = 6;
  string owner = 7;
  string ctime = 8;
  string mtime = 9;
  string auth_token = 10 [ json_name = "auth_token" ];
  bool default_strategy = 11 [ json_name = "default_strategy" ];
  map<string, string> metadata = 12;
  string source = 13;
  repeated string functions = 14;
  repeated StrategyResourceLabel resource_labels = 15 [ json_name = "resource_labels" ];
}

message ModifyAuthStrategy {
  string id = 1;
  string name = 2;
  Principals add_principals = 3 [ json_name = "add_principals" ];
  Principals remove_principals = 4 [ json_name = "remove_principals" ];
  StrategyResources add_resources = 5 [ json_name = "add_resources" ];
  StrategyResources remove_resources = 6 [ json_name = "remove_resources" ];
  AuthAction action = 7;
  string comment = 8;
  string owner = 9;
  map<string, string> metadata = 12;
  string source = 13;
  repeated string functions = 14;
  repeated StrategyResourceLabel resource_labels = 15 [ json_name = "resource_labels" ];
}
