syntax = "proto3";

package v1;

import "types.proto";
import "router.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/security";
option java_package = "io.pole.specification.api.v1.security";
option java_outer_classname = "BlockAllowListProto";

message BlockAllowListRule {
  // unique rule id
  string id = 1 [ json_name = "id" ];
  // unique rule name
  string name = 2 [ json_name = "name" ];
  // service namespace
  string namespace = 4 [ json_name = "namespace" ];
  // service name
  string service = 5 [ json_name = "service" ];
  // rule description
  string description = 6 [ json_name = "description" ];
  // rule priority
  uint32 priority = 7 [ json_name = "priority" ];
  // block or allow configuration
  repeated BlockAllowConfig blockAllowConfig = 12 [ json_name = "block_allow_config" ];
  // ctime create time of the rules
  string ctime = 20 [ json_name = "ctime" ];
  // mtime modify time of the rules
  string mtime = 21 [ json_name = "mtime" ];
  // metadata for block allow list rules
  map<string, string> metadata = 30 [ json_name = "metadata" ];
  // rule revision
  string revision = 31 [ json_name = "revision" ];
  // 规则的权限操作状态
  bool editable = 40 [ json_name = "editable" ];
  bool deleteable = 41 [ json_name = "deleteable" ];
}

message BlockAllowConfig {
  // blocking target api
  API api = 1 [ json_name = "api" ];
  // traffic match rule
  TrafficMatchRule traffic_match_rule = 2 [ json_name = "traffic_match_rule" ];
  // block or allow as policy
  enum BlockAllowPolicy {
    ALLOW_LIST = 0;
    BLOCK_LIST = 1;
  }
  // block or allow as policy
  BlockAllowPolicy blockAllowPolicy = 3 [ json_name = "block_allow_policy" ];
}

