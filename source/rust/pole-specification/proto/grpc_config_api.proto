syntax = "proto3";

package v1;

import "config_file.proto";
import "response.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/config_manage";
option java_package = "io.pole.specification.api.v1.config.manage";
option java_outer_classname = "PolarisConfigGRPCService";

service PolarisConfigGRPC {
  // 创建配置
  rpc CreateConfigFile(ConfigFile) returns (Response) {}
  // 更新配置
  rpc UpdateConfigFile(ConfigFile) returns (Response) {}
  // 发布配置
  rpc PublishConfigFile(ConfigFileRelease) returns (Response) {}
  // 创建/更新并发布配置
  rpc UpsertAndPublishConfigFile(ConfigFilePublishInfo) returns (Response) {}
  // 拉取指定配置分组下的配置文件列表
  rpc GetConfigFileMetadataList(ConfigFileGroupRequest) returns (Response) {}
  // 统一发现接口
  rpc Discover(stream ConfigDiscoverRequest) returns (stream ConfigDiscoverResponse) {}
}
