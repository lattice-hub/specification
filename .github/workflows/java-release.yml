name: Release Java

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: source/java/pole-specification/pom.xml
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set release version
        working-directory: source/java/pole-specification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must use vX.Y.Z or a SemVer prerelease: $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          actual="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$actual" = "$version"
      - name: Verify and publish
        working-directory: source/java/pole-specification
        run: mvn --batch-mode --no-transfer-progress -Prelease clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
