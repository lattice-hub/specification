name: Release Rust

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set crate version
        working-directory: source/rust/pole-specification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: sed -i 's/^version = ".*"/version = "'"${RELEASE_TAG#v}"'"/' Cargo.toml
      - name: Generate and build crate
        run: |
          chmod +x source/protoc/protoc-linux-x86_64/bin/protoc
          cd source/rust
          bash build.sh
          rm pole-specification/build.rs
      - name: Publish to crates.io
        working-directory: source/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --package pole-specification --allow-dirty
