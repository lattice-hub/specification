name: Testing

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        env:
          PROTOC: ${{ github.workspace }}/source/protoc/protoc-linux-x86_64/bin/protoc
        run: |
          chmod +x "$PROTOC"
          cargo test --all
      - name: Check
        env:
          PROTOC: ${{ github.workspace }}/source/protoc/protoc-linux-x86_64/bin/protoc
        run: cargo check --all

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/node
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/node/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test generated package
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/python
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: source/python/pyproject.toml
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Generate gRPC sources
        run: python scripts/generate.py
      - name: Test generated package
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Build distributions
        run: python -m build
      - name: Verify wheel import
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from pole_specification.generated import bootstrap_pb2, bootstrap_pb2_grpc"
