name: Testing

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        env:
          PROTOC: ${{ github.workspace }}/source/protoc/protoc-linux-x86_64/bin/protoc
        run: |
          chmod +x "$PROTOC"
          cargo test --all
