name: Testing

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        env:
          PROTOC: ${{ github.workspace }}/source/protoc/protoc-linux-x86_64/bin/protoc
        run: |
          chmod +x "$PROTOC"
          cargo test --all
      - name: Check
        env:
          PROTOC: ${{ github.workspace }}/source/protoc/protoc-linux-x86_64/bin/protoc
        run: cargo check --all

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/node
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/node/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test generated package
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/python
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: source/python/pyproject.toml
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Generate gRPC sources
        run: python scripts/generate.py
      - name: Test generated package
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Build distributions
        run: python -m build
      - name: Verify wheel import
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from pole_specification.generated import bootstrap_pb2, bootstrap_pb2_grpc"

  java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: source/java/pole-specification/pom.xml
      - name: Test and package generated Java API
        working-directory: source/java/pole-specification
        run: mvn --batch-mode --no-transfer-progress clean verify

  cpp:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache gRPC C++ toolchain
        uses: actions/cache@v5
        with:
          path: build/cpp-deps
          key: grpc-cpp-1.64.3-protobuf-26.1-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libc-ares-dev \
            libre2-dev \
            libssl-dev \
            pkg-config \
            zlib1g-dev
          bash source/cpp/pole-specification/scripts/install_grpc.sh build/cpp-deps
      - name: Generate, build, and test C++ package
        run: |
          cmake \
            -S source/cpp/pole-specification \
            -B build/cpp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/cpp-deps"
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure
          cmake --install build/cpp --prefix build/cpp-install
          cmake \
            -S source/cpp/pole-specification/tests/consumer \
            -B build/cpp-consumer \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/cpp-install;$PWD/build/cpp-deps"
          cmake --build build/cpp-consumer
      - name: Build generated source archives
        run: |
          python source/cpp/pole-specification/scripts/package.py \
            --version 0.1.0-CI \
            --generated-dir build/cpp/generated \
            --proto-dir build/cpp/proto \
            --output-dir build/cpp/dist
          sha256sum --check build/cpp/dist/SHA256SUMS
          package_root="$(mktemp -d)"
          tar -xzf build/cpp/dist/pole-specification-cpp-0.1.0-CI.tar.gz \
            -C "$package_root"
          cmake \
            -S "$package_root/pole-specification-cpp-0.1.0-CI" \
            -B build/cpp-package \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/cpp-deps"
          cmake --build build/cpp-package
