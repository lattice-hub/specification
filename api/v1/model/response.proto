syntax = "proto3";

package v1;

import "google/protobuf/any.proto";


option go_package = "github.com/pole-io/specification/source/go/api/v1/model";
option java_package = "io.pole.specification.api.v1.model";
option java_outer_classname = "ResponseProto";

message Response {
  uint32 code = 1;
  string info = 2;
  google.protobuf.Any data = 3;
}

message BatchWriteResponse {
  uint32 code = 1;
  string info = 2;
  uint32 size = 3;
  repeated Response responses = 4;
}

message BatchQueryResponse {
  uint32 code = 1;
  string info = 2;
  uint32 amount = 3;
  uint32 size = 4;
  repeated google.protobuf.Any data = 5;
}
