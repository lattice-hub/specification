syntax = "proto3";

package v1;

import "google/protobuf/wrappers.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/model";

option java_package = "io.pole.specification.api.v1.model";
option java_outer_classname = "ModelProto";

// 主调服务信息数据
message Caller {
  string namespace = 2;
  string service = 3;
  // 客户端标签
  repeated ClientLabel labels = 10;
}

message Location {
  google.protobuf.StringValue region = 1;
  google.protobuf.StringValue zone = 2;
  google.protobuf.StringValue campus = 3;
}

message MatchString {
  enum MatchStringType {
    // Equivalent match
    EXACT = 0;
    // Regular match
    REGEX = 1;
    // Not equals match
    NOT_EQUALS = 2;
    // Include match
    IN = 3;
    // Not include match
    NOT_IN = 4;
    // Range match
    RANGE = 5;
  }

  enum ValueType {
    TEXT = 0;
    PARAMETER = 1;
    VARIABLE = 2;
  }

  MatchStringType type = 1;
  google.protobuf.StringValue value = 2;
  ValueType value_type = 3 [ json_name = "value_type" ];
}

message StringList { repeated string values = 1; }

// 汇总查询数据
message Summary {
  // 服务总数
  uint32 total_service_count = 1 [ json_name = "total_service_count" ];
  // 健康实例总数
  uint32 total_health_instance_count = 2
      [ json_name = "total_health_instance_count" ];
  // 实例总数
  uint32 total_instance_count = 3 [ json_name = "total_instance_count" ];
}

message ClientLabel {
  string key = 1;
  MatchString value = 2;
}

// API统一数据结构
message API {
  // API的协议，*或者为空代表全部
  string protocol = 1 [ json_name = "protocol" ];
  // API的方法，*或者为空代表全部
  string method = 2 [ json_name = "method" ];
  // API的路径，支持多种匹配方式
  MatchString path = 3 [ json_name = "path" ];
}

// 治理规则发布请求
message RuleRelease {

  enum RuleType {
    RouteRules = 0;
    RateLimitRules = 1;
    CircuitBreakerRules = 2;
    FaultDetectRules = 3;
    LaneRules = 4;
    LosslessRules = 5;
  }

  string id = 1 [ json_name = "id" ];
  string rule_id = 2 [ json_name = "rule_id" ];
  string rule_name = 3 [ json_name = "rule_name" ];
  string release_name = 4 [ json_name = "release_name" ];
  string description = 5 [ json_name = "description" ];
  string release_type = 6 [ json_name = "release_type" ];
  ClientLabel client_label = 7 [ json_name = "client_label" ];
  uint64 version = 8 [ json_name = "version" ];
  RuleType resource = 9 [ json_name = "resource" ];
}
