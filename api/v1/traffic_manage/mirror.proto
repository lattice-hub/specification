syntax = "proto3";

package v1;

import "google/protobuf/duration.proto";
import "types.proto";
import "router.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/traffic_manage";
option java_package = "io.pole.specification.api.v1.traffic.manage";
option java_outer_classname = "TrafficMirrorProto";

// 流量镜像规则
message TrafficMirror {
    string id = 1;
    // 流量镜像规则名称
    string name = 2;
    // 流量镜像规则描述
    string description = 3;
    // 主调服务，namespace/service 均为 "*" 表示全部服务。
    ServiceScope caller = 4 [ json_name = "caller" ];
    // 被调服务，规则归属和下发绑定到该服务。
    ServiceScope callee = 5 [ json_name = "callee" ];
    // 流量镜像规则集合
    repeated MirrorRule rules = 6;
    // 是否启用
    bool enable = 7;
    // 流量镜像规则revision信息
    string revision = 8;
    // 规则优先级
    uint32 priority = 9;
    // 创建时间
    string ctime = 10;
    // 修改时间
    string mtime = 11;
    // 规则标签
    map<string, string> metadata = 12 [ json_name = "metadata" ];
    // 操作标志位
    bool editable = 13 [ json_name = "editable" ];
    bool deleteable = 14 [ json_name = "deleteable" ];
}

message MirrorRule {
    // 镜像接口范围
    API api = 1 [ json_name = "api" ];
    // 请求头、查询参数、路径、Cookie 等流量匹配条件；主调服务由 TrafficMirror.caller 统一表达。
    TrafficMatchRule traffic_match_rule = 2 [ json_name = "traffic_match_rule" ];
    // 目标服务
    MirrorDestination destination = 3;
    // 流量镜像百分比，0-100
    uint32 mirror_percent = 4 [json_name = "mirror_percent"];
    // 流量镜像持续时间，默认无限制
    google.protobuf.Duration duration = 5;
    // 子规则是否禁用，默认启用
    bool disable = 6;
}

message MirrorDestination {
    // 目标服务所在的命名空间
    string namespace = 1;
    // 目标服务名称
    string service = 2;
    // 目标服务实例标签选择器
    map<string, MatchString> labels = 3;
}
