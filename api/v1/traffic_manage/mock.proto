syntax = "proto3";

package v1;

import "google/protobuf/duration.proto";
import "types.proto";
import "router.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/traffic_manage";
option java_package = "io.pole.specification.api.v1.traffic.manage";
option java_outer_classname = "TrafficMockProto";

// 流量 Mock 规则，用于在命中请求时直接返回模拟响应。
message TrafficMock {
  string id = 1;
  // 流量 Mock 规则名称
  string name = 2;
  // 流量 Mock 规则描述
  string description = 3;
  // 主调服务范围，空表示任意主调
  SourceService caller = 4 [ json_name = "caller" ];
  // 被调服务，规则只绑定到该服务
  DestinationService callee = 5 [ json_name = "callee" ];
  // 流量 Mock 子规则集合
  repeated MockRule rules = 6;
  // 是否启用
  bool enable = 7;
  // 流量 Mock 规则 revision 信息
  string revision = 8;
  // 规则优先级
  uint32 priority = 9;
  // 创建时间
  string ctime = 10;
  // 修改时间
  string mtime = 11;
  // 规则标签
  map<string, string> metadata = 12;
  // 操作标志位
  bool editable = 13 [ json_name = "editable" ];
  bool deleteable = 14 [ json_name = "deleteable" ];
  // namespace identifies the environment that owns this rule.
  string namespace = 15 [ json_name = "namespace" ];
}

message MockRule {
  // Mock 接口范围，命中任一 API 即执行 Mock
  repeated API apis = 1 [ json_name = "apis" ];
  // 主调、请求头、查询参数、路径、Cookie 等流量匹配条件
  TrafficMatchRule traffic_match_rule = 2 [ json_name = "traffic_match_rule" ];
  // 命中后返回的模拟响应
  MockResponse response = 3;
  // Mock 命中百分比，0-100
  uint32 mock_percent = 4 [ json_name = "mock_percent" ];
  // 响应延迟，默认无延迟
  google.protobuf.Duration delay = 5;
  // 子规则是否禁用，默认启用
  bool disable = 6;
}

message MockResponse {
  // 业务错误码
  string code = 1;
  // 响应头
  map<string, string> headers = 2;
  // 响应体
  string body = 3;
}
