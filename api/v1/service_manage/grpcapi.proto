syntax = "proto3";

package v1;

import "client.proto";
import "service.proto";
import "heartbeat.proto";
import "contract.proto";
import "types.proto";
import "ratelimit.proto";
import "circuitbreaker.proto";
import "namespace.proto";
import "fault_detector.proto";
import "lane.proto";
import "router.proto";
import "lossless.proto";
import "block_allow_list.proto";
import "response.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/service_manage";
option java_package = "io.pole.specification.api.v1.service.manage";
option java_outer_classname = "PolarisGRPCService";


message DiscoverFilter {
  bool onlyHealthyInstance = 1 [ json_name = "only_healthy_instance" ];
  // pole.io 自定义信息
  Caller caller = 100 [ json_name = "caller" ];
}

message DiscoverRequest {
  enum DiscoverRequestType {
    UNKNOWN = 0;
    INSTANCE = 1;
    CLUSTER = 2;
    ROUTING = 3;
    RATE_LIMIT = 4;
    CIRCUIT_BREAKER = 5;
    SERVICES = 6;
    reserved 7 to 11;
    NAMESPACES = 12;
    FAULT_DETECTOR = 13;
    reserved 14 to 99;
    LANE = 100;
    // 自定义路由规则
    CUSTOM_ROUTE_RULE = 101;
    // 就近路由规则
    NEARBY_ROUTE_RULE = 102;
    // 无损上下线规则
    LOSSLESS = 103;
    // 服务黑白名单规则
    BLOCK_ALLOW_RULE = 104;

    // pole.io 自定义资源信息
    SERVICE_SUBSCRIBERS = 500;
  }

  DiscoverRequestType type = 1 [ json_name = "type" ];
  Service service = 2 [ json_name = "service" ];
  reserved 3 to 4;
  DiscoverFilter Filter = 30 [ json_name = "filter" ];
}



message DiscoverResponse {
  uint32 code = 1;
  string info = 2;

  enum DiscoverResponseType {
    UNKNOWN = 0;
    INSTANCE = 1;
    CLUSTER = 2;
    ROUTING = 3;
    RATE_LIMIT = 4;
    CIRCUIT_BREAKER = 5;
    SERVICES = 6;
    reserved 7 to 11;
    reserved "MESH", "MESH_CONFIG", "FLUX_DBREFRESH", "FLUX_SDK", "FLUX_SERVER";
    NAMESPACES = 12;
    FAULT_DETECTOR = 13;
    reserved 14 to 99;
    LANE = 100;
    // 自定义路由规则
    CUSTOM_ROUTE_RULE = 101;
    // 就近路由规则
    NEARBY_ROUTE_RULE = 102;
    // 无损上下线规则
    LOSSLESS = 103;
    // 服务黑白名单规则
    BLOCK_ALLOW_RULE = 104;
    // pole.io 自定义资源信息
    SERVICE_SUBSCRIBERS = 500;
  }

  DiscoverResponseType type = 3 [ json_name = "type" ];
  Service service = 4 [ json_name = "service" ];
  repeated Instance instances = 5 [ json_name = "instances" ];
  RateLimit rateLimit = 7 [ json_name = "rate_limit" ];
  repeated CircuitBreakerRule circuitBreaker = 8 [ json_name = "circuit_breaker" ];
  repeated Service services = 9 [ json_name = "services" ];
  repeated Namespace namespaces = 10 [ json_name = "namespaces" ];
  FaultDetector faultDetector = 11 [ json_name = "fault_detector" ];
  reserved 12 to 20;
  Service aliasFor = 21 [ json_name = "alias_for" ];
  repeated LaneGroup lanes = 22 [ json_name = "lanes" ];
  // 自定义路由规则内容
  repeated RouteRule customRouteRules = 23 [ json_name = "custom_route_rules" ];
  // 就近路由规则内容
  repeated RouteRule nearbyRouteRules = 24 [ json_name = "nearby_route_rules" ];
  // 无损上下线规则内容
  repeated LosslessRule losslessRules = 25 [ json_name = "lossless_rules" ];
  // 服务黑白名单鉴权规则
  repeated BlockAllowListRule blockAllowListRule = 26 [ json_name = "block_allow_list_rule" ];
}


service PolarisGRPC {
  // 客户端上报
  rpc ReportClient(Client) returns (Response) {}
  // 被调方注册服务实例
  rpc RegisterInstance(Instance) returns (Response) {}
  // 被调方反注册服务实例
  rpc DeregisterInstance(Instance) returns (Response) {}
  // 统一发现接口
  rpc Discover(stream DiscoverRequest) returns (stream DiscoverResponse) {}
  // 被调方批量上报心跳
  rpc Heartbeat(stream HeartbeatsRequest) returns (stream HeartbeatsResponse) {}
  // 上报服务契约
  rpc ReportServiceContract(ServiceContract) returns (Response) {}
}

service PolarisHeartbeatGRPC {
  // 批量获取心跳记录
  rpc BatchGetHeartbeat(GetHeartbeatsRequest) returns (GetHeartbeatsResponse) {}
  // 批量删除心跳记录
  rpc BatchDelHeartbeat(DelHeartbeatsRequest) returns (DelHeartbeatsResponse) {}
}
