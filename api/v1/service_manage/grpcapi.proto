syntax = "proto3";

package v1;

import "client.proto";
import "service.proto";
import "heartbeat.proto";
import "contract.proto";
import "types.proto";
import "ratelimit.proto";
import "circuitbreaker.proto";
import "namespace.proto";
import "fault_detector.proto";
import "lane.proto";
import "router.proto";
import "lossless.proto";
import "block_allow_list.proto";
import "response.proto";

option go_package = "github.com/pole-io/specification/source/go/api/v1/service_manage";
option java_package = "io.pole.specification.api.v1.service.manage";
option java_outer_classname = "PolarisGRPCService";


message DiscoverFilter {
  bool onlyHealthyInstance = 1 [ json_name = "only_healthy_instance" ];
  // pole.io 自定义信息
  Caller caller = 100 [ json_name = "caller" ];
}

message DiscoverRequest {
  enum DiscoverRequestType {
    UNKNOWN = 0;
    // 拉起命名空间列表
    NAMESPACES = 1;
    // 服务列表
    SERVICES = 2;
    // 服务实例列表
    INSTANCE = 3;
    // 服务契约列表
    SERVICE_CONTRACTS = 4;
    // 限流规则
    RATE_LIMIT = 20;
    // 熔断规则
    CIRCUIT_BREAKER = 21;
    // 故障检测规则
    FAULT_DETECTOR = 22;
    // 自定义路由规则
    CUSTOM_ROUTE_RULE = 23;
    // 就近路由规则
    NEARBY_ROUTE_RULE = 24;
    // 泳道规则
    LANE = 25;
    // 无损上下线规则
    LOSSLESS = 26;
    // 服务黑白名单规则
    BLOCK_ALLOW_RULE = 27;
    // 服务订阅视图
    SERVICE_SUBSCRIBERS = 50;
  }

  DiscoverRequestType type = 1 [ json_name = "type" ];
  Service service = 2 [ json_name = "service" ];
  DiscoverFilter Filter = 30 [ json_name = "filter" ];
}

message DiscoverResponse {
  uint32 code = 1;
  string info = 2;

  enum DiscoverResponseType {
    UNKNOWN = 0;
    // 拉起命名空间列表
    NAMESPACES = 1;
    // 服务列表
    SERVICES = 2;
    // 服务实例列表
    INSTANCE = 3;
    // 服务契约列表
    SERVICE_CONTRACTS = 4;
    // 限流规则
    RATE_LIMIT = 20;
    // 熔断规则
    CIRCUIT_BREAKER = 21;
    // 故障检测规则
    FAULT_DETECTOR = 22;
    // 自定义路由规则
    CUSTOM_ROUTE_RULE = 23;
    // 就近路由规则
    NEARBY_ROUTE_RULE = 24;
    // 泳道规则
    LANE = 25;
    // 无损上下线规则
    LOSSLESS = 26;
    // 服务黑白名单规则
    BLOCK_ALLOW_RULE = 27;
    // 服务订阅视图
    SERVICE_SUBSCRIBERS = 50;
  }

  DiscoverResponseType type = 3 [ json_name = "type" ];
  // 服务
  Service service = 4 [ json_name = "service" ];
  // 服务真实名称
  Service aliasFor = 5 [ json_name = "alias_for" ];
  // 命名空间列表
  repeated Namespace namespaces = 6 [ json_name = "namespaces" ];
  // 服务列表
  repeated Service services = 7 [ json_name = "services" ];
  // 服务实例列表
  repeated Instance instances = 8 [ json_name = "instances" ];
  // 服务契约
  repeated ServiceContract serviceContracts = 9 [ json_name = "service_contracts" ];
  // 限流规则
  repeated RateLimit rateLimit = 20 [ json_name = "rate_limit" ];
  // 熔断规则
  repeated CircuitBreakerRule circuitBreaker = 21 [ json_name = "circuit_breaker" ];
  // 故障检测规则
  FaultDetector faultDetector = 22 [ json_name = "fault_detector" ];
  // 全链路灰度泳道
  repeated LaneGroup lanes = 23 [ json_name = "lanes" ];
  // 自定义路由规则内容
  repeated RouteRule customRouteRules = 24 [ json_name = "custom_route_rules" ];
  // 就近路由规则内容
  repeated RouteRule nearbyRouteRules = 25 [ json_name = "nearby_route_rules" ];
  // 无损上下线规则内容
  repeated LosslessRule losslessRules = 26 [ json_name = "lossless_rules" ];
  // 服务黑白名单鉴权规则
  repeated BlockAllowListRule blockAllowListRule = 27 [ json_name = "block_allow_list_rule" ];
}


service PolarisGRPC {
  // 客户端上报
  rpc ReportClient(Client) returns (Response) {}
  // 被调方注册服务实例
  rpc RegisterInstance(Instance) returns (Response) {}
  // 被调方反注册服务实例
  rpc DeregisterInstance(Instance) returns (Response) {}
  // 统一发现接口
  rpc Discover(stream DiscoverRequest) returns (stream DiscoverResponse) {}
  // 被调方批量上报心跳
  rpc Heartbeat(stream HeartbeatsRequest) returns (stream HeartbeatsResponse) {}
  // 上报服务契约
  rpc ReportServiceContract(ServiceContract) returns (Response) {}
}

service PolarisHeartbeatGRPC {
  // 批量获取心跳记录
  rpc BatchGetHeartbeat(GetHeartbeatsRequest) returns (GetHeartbeatsResponse) {}
  // 批量删除心跳记录
  rpc BatchDelHeartbeat(DelHeartbeatsRequest) returns (DelHeartbeatsResponse) {}
}
